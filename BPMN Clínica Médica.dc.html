  renderVals() {

    const cxr = c => X0 + c * colW + colW / 2;
    const sh = c => c >= 27 ? c + 1 : c;
    const cx = c => cxr(sh(c));
    const LANES = [['P', 'Paciente', '#e8f4fb', '#bee2ff'], ['S', 'Sistema de Gestão', '#f3f6f8', '#d6dee2'], ['R', 'Recepção', '#f7f2fc', '#e8d8f5'], ['H', 'Profissional de Saúde', '#e1faf4', '#b9e7dc'], ['F', 'Setor Financeiro', '#fef7f2', '#fad1b7']];
    const LY = { L: 75, O: MB + 205 };

      else if (mode === 'HVH') { const x = a.cx + colW / 2 - (a.hw === NW / 2 ? 0 : 0) + (NW / 2 - a.hw) * 0 + (colW / 2 - NW / 2) * 0; const xv = X0 + Math.round((a.cx - X0) / colW) * colW; pts = [R(f), [xv, a.cy], [xv, b.cy], L(t)]; }
      else if (mode === 'VH') pts = [b.cy < a.cy ? T(f) : B(f), [a.cx, b.cy], L(t)];

      edges.push({ pts, label, k, msg: !!o.msg, lx: o.lx || 0, ly: o.ly || 0, at: o.at, end: o.end });

    const S = d => Y('S', d), P = d => Y('P', d), Rr = d => Y('R', d), F = d => Y('F', d);

    E('n19', 'n20'); E('n20', 'n20b', 'H'); E('n20b', 'n20c', 'H', 'Não');
    E('n20b', 'n14', [T('n20b'), [cx(19), P(-72)], [cx(11), P(-72)], T('n14')], 'Sim', 1);
    E('n21', 'n22', 'HVH', 'Sim'); E('n21', 'n25', [T('n21'), [cx(13), S(0)], L('n25')], 'Não', 1);
    E('n22', 'n23'); E('n23', 'n24', 'V'); E('n24', 'n24b', 'H'); E('n24b', 'n24c', 'H', 'Não');
    E('n24b', 'n25', [T('n24b'), [cx(17), S(0)], L('n25')], 'Sim', 1);
    E('n25', 'n26', 'H'); E('n26', 'n27', 'H'); E('n27', 'n28'); E('n28', 'n29', 'H');
    E('n29', 'n46'); E('n46', 'n30', 'VH', 'Sim', 1); E('n46', 'n47', 'H', 'Não'); E('n47', 'n48', 'H');
    E('nb', 'n40', [B('nb'), [NM.nb.cx, S(64)], L('n40')]);
    E('n40', 'n41', 'H'); E('n41', 'n42', 'H', 'Cancelar'); E('n42', 'n43', 'H');
    E('n41', 'n44', [R('n41'), [cxr(26) + 75, S(64)], [cxr(26) + 75, S(-64)], L('n44')], 'Reagendar', 1, { at: [cxr(26) + 70, S(-34)], end: true });
    E('n44', 'n45', 'H');
    E('n45', 'n9', [[cx(27) - 50, S(-89)], [cx(27) - 50, S(-100)], [cx(27) - 75, S(-100)], [cx(27) - 75, P(-98)], [cx(7), P(-98)], T('n9')]);
    E('n30', 'n31', [R('n30'), [cx(28), P(0)], T('n31')]);
    E('n31', 'n32', 'H'); E('n32', 'n37', 'H', 'Sim'); E('n32', 'n33', 'VH', 'Não'); E('n33', 'n34', 'H');
    E('n34', 'n35', 'H', 'Não'); E('n35', 'n36', 'H');
    E('n34', 'n37', [T('n34'), [cx(31), Rr(0)], L('n37')], 'Sim', 1);
    E('n37', 'n38', 'H'); E('n38', 'n39', 'V', 'Sim'); E('n39', 'n37', [L('n39'), [cx(32), P(0)], T('n37')]);
    E('n38', 'n49', 'HVH', 'Não');
    E('n49', 'n50'); E('n50', 'n51', 'H'); E('n51', 'n52', 'H'); E('n52', 'n53', 'H'); E('n53', 'n54');
    E('n54', 'n55', 'VH', 'Exames', 0, { lx: -44, ly: 0 }); E('n54', 'n59', 'VH', 'Retorno'); E('n54', 'n60', 'H', 'Nenhum');
    E('n55', 'n56', 'H', 'Parceiro'); E('n56', 'n57', 'H');
    E('n55', 'n58', [B('n55'), [cx(40), S(-30)], [cx(40) + 75, S(-30)], [cx(40) + 75, S(64)], L('n58')], 'Própria', 1);
    E('n57', 'n60'); E('n58', 'n60');
    E('n59', 'n60', [B('n59'), [cx(40), S(102)], [cx(43) - 20, S(102)], [cx(43) - 20, S(25)]]);
    E('n60', 'n61');
    E('n61', 'n62', 'VH', 'Convênio', 1); E('n61', 'n63', 'VH', 'Particular', 1);
    E('n62', 'n67', [R('n62'), [cx(49), F(-64)], T('n67')]);
    E('n63', 'n64', 'H', 'Sim'); E('n63', 'n67', [B('n63'), [cx(45), F(96)], [cx(49), F(96)], B('n67')], 'Não', 1);
    E('n64', 'n65'); E('n65', 'n66'); E('n66', 'n67');
    E('n67', 'n68', [R('n67'), [cx(49) + 75, F(0)], [cx(49) + 75, F(64)], L('n68')], 'Sim', 1);
    E('n67', 'n69', 'HVH', 'Não');
    E('n68', 'n60', [B('n68'), [cx(50), F(102)], [cx(43) + 20, F(102)], [cx(43) + 20, S(25)]]);
    E('n69', 'n70', 'H');
    // Mensagens
    M([[cx(13) - 30, S(-39)], [cx(13) - 30, Y('O', -25)]]);
    M([[cx(14), Y('O', -25)], [cx(14), S(-47)]]);
    M([[cx(21), S(25)], [cx(21), NY0]]); M([[cx(22), S(25)], [cx(22), NY0]]);
    M([[cxr(27), S(89)], [cxr(27), NY0]]); M([[cx(27) - 20, S(-39)], [cx(27) - 20, NY0]]);
    M([[cx(41) + 30, S(-89)], [cx(41) + 30, Y('L', 25)]]); M([[cx(42) - 30, Y('L', 25)], [cx(42) - 30, S(-89)]]);
    M([[cx(45) - 35, F(-39)], [cx(45) - 35, Y('O', -25)]]);

    // hops: arcs on horizontals crossing other edges' verticals
    const segs = [];
    edges.forEach((e, i) => { for (let k = 0; k < e.pts.length - 1; k++) { const [x1, y1] = e.pts[k], [x2, y2] = e.pts[k + 1]; if (x1 === x2) segs.push({ e: i, x: x1, y0: Math.min(y1, y2), y1: Math.max(y1, y2) }); } });
    const r = 5;
    const arrow = (p, q) => { let dx = q[0] - p[0], dy = q[1] - p[1]; const Ln = Math.hypot(dx, dy) || 1; dx /= Ln; dy /= Ln; const bx = q[0] - dx * 9, by = q[1] - dy * 9; return `${q[0]},${q[1]} ${(bx - dy * 4.5).toFixed(1)},${(by + dx * 4.5).toFixed(1)} ${(bx + dy * 4.5).toFixed(1)},${(by - dx * 4.5).toFixed(1)}`; };
    const edgeLabels = [];
    edges.forEach((e, i) => {
      const pts = e.pts.map(p => p.slice());
      const n = pts.length, q = pts[n - 2], p = pts[n - 1];
      e.arrow = arrow(q, p);
      if (e.msg) { const dx = Math.sign(p[0] - q[0]), dy = Math.sign(p[1] - q[1]); pts[n - 1] = [p[0] - dx * 8, p[1] - dy * 8]; const s = pts[0], s2 = pts[1]; pts[0] = [s[0] + Math.sign(s2[0] - s[0]) * 3.5, s[1] + Math.sign(s2[1] - s[1]) * 3.5]; e.sx = s[0]; e.sy = s[1]; }
      let d = '';
      pts.forEach((pt, k) => {
        if (k === 0) { d += `M${pt[0]} ${pt[1]}`; return; }
        const pr = pts[k - 1];
        if (pr[1] === pt[1] && pr[0] !== pt[0]) {
          const y = pt[1], dir = Math.sign(pt[0] - pr[0]), lo = Math.min(pr[0], pt[0]), hi = Math.max(pr[0], pt[0]);
          segs.filter(s => s.e !== i && s.y0 < y - 1 && s.y1 > y + 1 && lo + 1 < s.x && s.x < hi - 1).map(s => s.x).sort((a, b) => dir * (a - b))
            .forEach(x => { d += `L${x - dir * r} ${y}A${r} ${r} 0 0 ${dir > 0 ? 1 : 0} ${x + dir * r} ${y}`; });
        }
        d += `L${pt[0]} ${pt[1]}`;
      });
      e.d = d;
      if (e.label && e.at) { edgeLabels.push({ x: e.at[0], y: e.at[1], t: e.label, end: !!e.end }); }
      else if (e.label) {
        const a = e.pts[e.k], b = e.pts[e.k + 1];
        let x, y;
        if (a[1] === b[1]) { x = a[0] + (b[0] > a[0] ? 5 : -40); y = a[1] - 5; }
        else if (b[1] < a[1]) { x = a[0] + 5; y = a[1] - 8; }
        else { x = a[0] + 5; y = a[1] + 13; }
        edgeLabels.push({ x: x + e.lx, y: y + e.ly, t: e.label });
      }
    });
    const seq = edges.filter(e => !e.msg), msgs = edges.filter(e => e.msg);

    const ico = {
      user: (x, y) => `M${x + 1.5} ${y + 4}a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0M${x - 0.5} ${y + 13}q0 -5.5 4.5 -5.5q4.5 0 4.5 5.5z`,
      service: (x, y) => { const c = [x + 5, y + 6]; let d = `M${c[0] - 3} ${c[1]}a3 3 0 1 0 6 0a3 3 0 1 0 -6 0`; for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; d += `M${(c[0] + 4.2 * Math.cos(a)).toFixed(1)} ${(c[1] + 4.2 * Math.sin(a)).toFixed(1)}L${(c[0] + 6.4 * Math.cos(a)).toFixed(1)} ${(c[1] + 6.4 * Math.sin(a)).toFixed(1)}`; } return d; },
      msg: (x, y) => `M${x - 7} ${y - 5}h14v10h-14zM${x - 7} ${y - 5}l7 5.5l7 -5.5`,
      timer: (x, y) => `M${x - 7} ${y}a7 7 0 1 0 14 0a7 7 0 1 0 -14 0M${x} ${y}v-5M${x} ${y}h3.5` + [0, 1, 2, 3].map(k => { const a = k * Math.PI / 2; return `M${(x + 5.2 * Math.cos(a)).toFixed(1)} ${(y + 5.2 * Math.sin(a)).toFixed(1)}L${(x + 7 * Math.cos(a)).toFixed(1)} ${(y + 7 * Math.sin(a)).toFixed(1)}`; }).join('')
    };
    const tasks = [], gateways = [], starts = [], inters = [], ends = [], taskLines = [], labMid = [], labStart = [], labEnd = [];
    nodes.forEach(n => {
      const lines = n.label.split('\n');
      if (/user|service|task/.test(n.type)) {
        tasks.push({ x: n.cx - n.hw, y: n.cy - n.hh, w: n.w, icon: n.type === 'user' ? ico.user(n.cx - n.hw + 4, n.cy - n.hh + 3) : n.type === 'service' ? ico.service(n.cx - n.hw + 4, n.cy - n.hh + 3) : 'M0 0' });
        const hasIcon = n.type !== 'task', three = lines.length === 3, off = hasIcon ? (three ? 5 : 4) : 0, pitch = three ? 12 : 13;
        lines.forEach((t, i) => taskLines.push({ x: n.cx + (hasIcon ? 4 : 0), y: n.cy + off + (i - (lines.length - 1) / 2) * pitch + 4, t }));
        return;
      }
      if (n.type === 'xor') { gateways.push({ pts: `${n.cx},${n.cy - GH} ${n.cx + GH},${n.cy} ${n.cx},${n.cy + GH} ${n.cx - GH},${n.cy}`, xd: `M${n.cx - 6.5} ${n.cy - 6.5}L${n.cx + 6.5} ${n.cy + 6.5}M${n.cx + 6.5} ${n.cy - 6.5}L${n.cx - 6.5} ${n.cy + 6.5}` }); }
      else if (n.type === 'start') starts.push({ cx: n.cx, cy: n.cy });
      else if (n.type === 'end') ends.push({ cx: n.cx, cy: n.cy });
      else inters.push({ cx: n.cx, cy: n.cy, icon: n.type === 'itimer' ? ico.timer(n.cx, n.cy) : n.type === 'inter' ? 'M0 0' : ico.msg(n.cx, n.cy) });
      // labels
      const above = n.type === 'xor' || n.lab === 'above';
      let dx = 0, anchor = 'middle', ys;
      if (n.lab === 'right') { dx = n.hh + 10; anchor = 'start'; ys = lines.map((_, i) => n.cy - (lines.length - 1) * 6 + i * 12 + 4); }
      else if (n.lab && typeof n.lab === 'object') { dx = n.lab.dx; anchor = n.lab.anchor; const base = n.lab.dy != null ? n.cy + n.lab.dy : above ? n.cy - n.hh - 6 - (lines.length - 1) * 12 : n.cy + n.hh + 12; ys = lines.map((_, i) => base + i * 12); }
      else if (above) ys = lines.map((_, i) => n.cy - n.hh - 3 - (lines.length - 1 - i) * 11);
      else ys = lines.map((_, i) => n.cy + n.hh + 14 + i * 12);
      const tgt = anchor === 'start' ? labStart : anchor === 'end' ? labEnd : labMid;
      lines.forEach((t, i) => tgt.push({ x: n.cx + dx, y: ys[i], t }));
    });

    const lanes = LANES.map((l, i) => ({ name: l[1], fill: l[2], hfill: l[3], y: MT + i * LH, cy: MT + i * LH + LH / 2 }));
    const pools = [
      { name: 'Laboratório Parceiro', x: cx(40) - 50, y: 0, w: cx(43) + 50 - (cx(40) - 50), h: 150, cy: 75 },
      { name: 'Operadora de Convênio', x: cx(12) - 40, y: OY0 - 20, w: cx(46) + 40 - (cx(12) - 40), h: 150, cy: OY0 + 55 }
    ].map(p => ({ ...p, hx: p.x + 15 }));
    const npool = { x: cx(20) - 40, y: NY0, w: cx(28) + 40 - (cx(20) - 40), cx: (cx(20) + cx(28)) / 2, cy: NY0 + 30 };

    [taskLines, labMid, labStart, labEnd, edgeLabels].forEach(a => a.forEach(t => t.y += 3));
    const edgeLabelsEnd = edgeLabels.filter(t => t.end), edgeLabelsStart = edgeLabels.filter(t => !t.end);
    return { lanes, pools, npool, seq, msgs, tasks, gateways, starts, inters, ends, taskLines, labMid, labStart, labEnd, edgeLabelsStart, edgeLabelsEnd,
      legUser: ico.user(68, 1418), legService: ico.service(266, 1418), seqArrow: arrow([460, 1429], [532, 1429]), msgArrow: arrow([650, 1429], [712, 1429]) };
  }
